openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: airports
    description: Airport reference information
  - name: airlines
    description: Airline reference information
  - name: weather
    description: Current airport-area weather
  - name: flights
    description: Verified flight status and schedule data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /airports:
    get:
      operationId: listAirports
      tags: [airports]
      summary: Search airport reference data
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Matching airport reference records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AirportSearchResponse"
        "503":
          description: Airport reference data is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /airports/{code}:
    get:
      operationId: getAirport
      tags: [airports]
      summary: Get an airport by IATA code
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 3
      responses:
        "200":
          description: Airport reference record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Airport"
        "404":
          description: Airport not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Airport reference data is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /airlines:
    get:
      operationId: listAirlines
      tags: [airlines]
      summary: Search airline reference data
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Matching airline reference records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AirlineSearchResponse"
        "503":
          description: Airline reference data is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /weather:
    get:
      operationId: getAirportWeather
      tags: [weather]
      deprecated: true
      summary: Retired non-commercial weather endpoint; use airport conditions
      description: Always returns 410. Use /airports/{code}/conditions for NOAA aviation weather.
      responses:
        "410":
          description: Non-commercial hosted weather retired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /flights:
    get:
      operationId: searchFlights
      tags: [flights]
      summary: Search verified flight records
      parameters:
        - name: origin
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 3
        - name: destination
          in: query
          required: false
          schema:
            type: string
            minLength: 3
            maxLength: 3
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Flight records returned by the configured flight data provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlightSearchResponse"
        "503":
          description: Flight data provider is unavailable or not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /airports/{code}/resources:
    get:
      operationId: getAirportResources
      summary: Airport infrastructure and official links
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z]{3}$" } }
      responses:
        "200":
          description: Sourced reference facts, with explicit partial failures
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AirportResources" }
  /airports/{code}/conditions:
    get:
      operationId: getAirportConditions
      summary: Aviation weather and US alerts
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z]{3}$" } }
      responses:
        "200":
          description: Independent METAR, TAF and alert availability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AirportConditions" }
  /currencies:
    get:
      operationId: listCurrencies
      summary: Supported Frankfurter currencies
      responses:
        "200":
          description: Available currency names and codes
          content:
            application/json:
              schema:
                type: object
                required: [currencies, source, fetchedAt]
                properties:
                  currencies:
                    type: array
                    items:
                      type: object
                      required: [code, name]
                      properties:
                        code: { type: string }
                        name: { type: string }
                  source: { type: string }
                  fetchedAt: { type: string, format: date-time }
  /exchange-rate:
    get:
      operationId: getExchangeRate
      summary: Reference currency rate, not a retail quote
      parameters:
        - { name: base, in: query, required: true, schema: { type: string, pattern: "^[A-Za-z]{3}$" } }
        - { name: quote, in: query, required: true, schema: { type: string, pattern: "^[A-Za-z]{3}$" } }
      responses:
        "200":
          description: Dated blended reference rate
          content:
            application/json:
              schema:
                type: object
                required: [base, quote, rate, date, fetchedAt, source]
                properties:
                  base: { type: string }
                  quote: { type: string }
                  rate: { type: number }
                  date: { type: string }
                  fetchedAt: { type: string, format: date-time }
                  source: { type: string }
  /sources:
    get:
      operationId: listDataSources
      summary: Reviewed source registry and usage restrictions
      responses:
        "200":
          description: Research metadata, not a feed uptime guarantee
          content:
            application/json:
              schema:
                type: object
                required: [reviewedAt, sources]
                properties:
                  reviewedAt: { type: string }
                  sources:
                    type: array
                    items:
                      type: object
                      required: [id, name, category, status, commercialUse, license, coverage, usage, limitations, url, termsUrl, refresh]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        category: { type: string }
                        status: { type: string, enum: [integrated, link-only, planned, restricted] }
                        commercialUse: { type: string }
                        license: { type: string }
                        coverage: { type: string }
                        usage: { type: string }
                        limitations: { type: string }
                        url: { type: string }
                        termsUrl: { type: string }
                        refresh: { type: string }
components:
  schemas:
    AirportResources:
      type: object
      required: [airportCode, source, fetchedAt, runways, frequencies, navaids, warnings, mapUrl]
      properties:
        airportCode: { type: string }
        countryName: { type: ["string", "null"] }
        officialWebsite: { type: ["string", "null"] }
        wikipediaUrl: { type: ["string", "null"] }
        mapUrl: { type: string }
        source: { type: string }
        fetchedAt: { type: string, format: date-time }
        warnings: { type: array, items: { type: string } }
        runways:
          type: array
          items:
            type: object
            required: [ident, lighted, closed]
            properties:
              ident: { type: string }
              lengthFt: { type: ["number", "null"] }
              widthFt: { type: ["number", "null"] }
              surface: { type: ["string", "null"] }
              lighted: { type: boolean }
              closed: { type: boolean }
        frequencies:
          type: array
          items:
            type: object
            required: [type, description, mhz]
            properties:
              type: { type: string }
              description: { type: string }
              mhz: { type: number }
        navaids:
          type: array
          items:
            type: object
            required: [ident, name, type]
            properties:
              ident: { type: string }
              name: { type: string }
              type: { type: string }
              frequencyKhz: { type: ["number", "null"] }
    AirportConditions:
      type: object
      required: [station, fetchedAt, source, metarStatus, tafStatus, alertsStatus, alerts, warnings]
      properties:
        station: { type: ["string", "null"] }
        fetchedAt: { type: string, format: date-time }
        source: { type: string }
        metarStatus: { type: string }
        tafStatus: { type: string }
        alertsStatus: { type: string }
        warnings: { type: array, items: { type: string } }
        metar:
          type: ["object", "null"]
          required: [raw]
          properties:
            raw: { type: string }
            observedAt: { type: ["string", "null"] }
            temperatureC: { type: ["number", "null"] }
            dewpointC: { type: ["number", "null"] }
            windKnots: { type: ["number", "null"] }
            windDirection: { type: ["string", "null"] }
            visibilityMiles: { type: ["string", "null"] }
            pressureHpa: { type: ["number", "null"] }
            category: { type: ["string", "null"] }
        taf:
          type: ["object", "null"]
          required: [raw]
          properties:
            raw: { type: string }
            issuedAt: { type: ["string", "null"] }
            validFrom: { type: ["string", "null"] }
            validTo: { type: ["string", "null"] }
        alerts:
          type: array
          items:
            type: object
            required: [event, headline, severity, description]
            properties:
              event: { type: string }
              headline: { type: string }
              severity: { type: string }
              description: { type: string }
              expires: { type: ["string", "null"] }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    Airport:
      type: object
      properties:
        code:
          type: string
        icao:
          type: ["string", "null"]
        name:
          type: string
        city:
          type: string
        country:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        timezone:
          type: ["string", "null"]
        type:
          type: string
      required: [code, name, city, country, latitude, longitude, type]
    AirportSearchResponse:
      type: object
      properties:
        airports:
          type: array
          items:
            $ref: "#/components/schemas/Airport"
        source:
          type: string
        fetchedAt:
          type: string
          format: date-time
        attribution:
          type: string
      required: [airports, source, fetchedAt, attribution]
    Airline:
      type: object
      properties:
        code:
          type: string
        icao:
          type: ["string", "null"]
        name:
          type: string
        country:
          type: ["string", "null"]
      required: [code, name]
    AirlineSearchResponse:
      type: object
      properties:
        airlines:
          type: array
          items:
            $ref: "#/components/schemas/Airline"
        source:
          type: string
        fetchedAt:
          type: string
          format: date-time
        attribution:
          type: string
      required: [airlines, source, fetchedAt, attribution]
    AirportWeather:
      type: object
      properties:
        temperatureC:
          type: number
        feelsLikeC:
          type: number
        humidityPercent:
          type: integer
        precipitationMm:
          type: number
        weatherCode:
          type: integer
        windSpeedKmh:
          type: number
        timezone:
          type: string
        fetchedAt:
          type: string
          format: date-time
        source:
          type: string
      required:
        - temperatureC
        - feelsLikeC
        - humidityPercent
        - precipitationMm
        - weatherCode
        - windSpeedKmh
        - timezone
        - fetchedAt
        - source
    Flight:
      type: object
      properties:
        id:
          type: string
        flightNumber:
          type: ["string", "null"]
        airlineIata:
          type: ["string", "null"]
        airlineName:
          type: ["string", "null"]
        originCode:
          type: ["string", "null"]
        originAirport:
          type: ["string", "null"]
        destinationCode:
          type: ["string", "null"]
        destinationAirport:
          type: ["string", "null"]
        scheduledDeparture:
          type: ["string", "null"]
          format: date-time
        estimatedDeparture:
          type: ["string", "null"]
          format: date-time
        actualDeparture:
          type: ["string", "null"]
          format: date-time
        scheduledArrival:
          type: ["string", "null"]
          format: date-time
        estimatedArrival:
          type: ["string", "null"]
          format: date-time
        actualArrival:
          type: ["string", "null"]
          format: date-time
        status:
          type: ["string", "null"]
        terminal:
          type: ["string", "null"]
        gate:
          type: ["string", "null"]
        aircraft:
          type: ["string", "null"]
      required: [id]
    FlightSearchResponse:
      type: object
      properties:
        flights:
          type: array
          items:
            $ref: "#/components/schemas/Flight"
        source:
          type: string
        fetchedAt:
          type: string
          format: date-time
        attribution:
          type: string
      required: [flights, source, fetchedAt, attribution]

